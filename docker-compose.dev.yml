services:
  graviton-worker:
    volumes:
      - ./core:/app/core

  graviton-gateway:
    volumes:
      - ./core:/app/core

  graviton-frontend:
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
