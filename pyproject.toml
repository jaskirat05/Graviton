[project]
name = "comfy-chain"
version = "0.1.0"
description = "Distributed GPU farm orchestration for ComfyUI workflow chains"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "structlog>=24.1.0",
    "websocket-client>=1.6.0",
    "temporalio>=1.5.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "httpx>=0.28.1",
    "websockets>=15.0.1",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "simpleeval>=0.9.13",
    "networkx>=3.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "shellingham>=1.5.0",
    "broadcaster[redis]>=0.3.0",
    "sse-starlette>=1.6.0",
    "httpx-sse>=0.4.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
comfy-chain = "core.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.uv]
package = true
