x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-graviton-backend:dev}
  build:
    context: .
    dockerfile: Dockerfile

x-backend-env: &backend-env
  TEMPORAL_ADDRESS: temporal:7233
  REDIS_URL: redis://redis:6379
  REGISTRY_NATS_URL: nats://nats:4222
  REGISTRY_TEMPLATE_ROOT_DIR: /app/registry_templates
  DATABASE_URL: postgresql://temporal:temporal@graviton-postgresql:5432/temporal
  HOST_UID: ${HOST_UID:-}
  HOST_GID: ${HOST_GID:-}

services:
  graviton-postgresql:
    container_name: graviton-postgresql
    profiles: ["infra"]
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:${POSTGRESQL_VERSION:-16}
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data

  temporal:
    container_name: temporalite
    profiles: ["infra"]
    image: temporalio/temporal:${TEMPORAL_CLI_VERSION:-1.5.1}
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
    networks:
      - temporal-network
    ports:
      - 7233:7233
      - 8233:8233

  redis:
    container_name: temporal-redis
    profiles: ["infra"]
    image: redis:${REDIS_VERSION:-7-alpine}
    networks:
      - temporal-network
    ports:
      - 6379:6379
    volumes:
      - /var/lib/redis/data

  nats:
    container_name: temporal-nats
    profiles: ["infra"]
    image: nats:2-alpine
    command: ["-js"]
    networks:
      - temporal-network
    ports:
      - 4222:4222
      - 8222:8222

  graviton-worker:
    <<: *backend-image
    container_name: graviton-worker
    profiles: ["app"]
    command: python core/worker.py
    depends_on:
      - temporal
      - redis
      - graviton-postgresql
      - nats
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env
    volumes:
      - ./registry_templates:/app/registry_templates
      - ./artifacts:/app/artifacts
    networks:
      - temporal-network
    restart: unless-stopped

  graviton-gateway:
    <<: *backend-image
    container_name: graviton-gateway
    profiles: ["app"]
    command: python core/main.py
    depends_on:
      - temporal
      - redis
      - graviton-worker
      - graviton-postgresql
      - nats
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *backend-env
    ports:
      - 8001:8001
    volumes:
      - ./registry_templates:/app/registry_templates
      - ./artifacts:/app/artifacts
    networks:
      - temporal-network
    restart: unless-stopped

  graviton-frontend:
    container_name: graviton-frontend
    profiles: ["app"]
    image: ${FRONTEND_IMAGE:-graviton-frontend:dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - graviton-gateway
    environment:
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    ports:
      - 3000:3000
    networks:
      - temporal-network
    restart: unless-stopped

networks:
  temporal-network:
    driver: bridge
    name: temporal-network
