name: image-edit-to-video-pipeline
description: "Extract two frames from video, edit them with Qwen AI, and create video\
  \ from edited frames.\n\nExecution plan:\n  Level 0: extract_frame1, extract_frame2\
  \ (parallel - extract 2 frames)\n  Level 1: edit_frame1, edit_frame2 (parallel -\
  \ AI edit both frames)\n  Level 2: create_video (sequential - combine into video)\n"
steps:
- id: extract_frame1
  workflow: imageSave
  description: Extract first frame from video
  requires_approval: true
  approval:
    timeout_hours: 24
    on_rejected: regenerate
    max_retries: 2
    timeout_action: auto_reject
  parameters:
    1.video: ComfyUI_00012_.mp4
    1.select_every_nth: 1
    1.skip_first_frames: 0
    1.frame_load_cap: 1
- id: extract_frame2
  workflow: imageSave
  description: Extract frame after skipping 172 frames
  parameters:
    1.video: ComfyUI_00012_.mp4
    1.select_every_nth: 1
    1.skip_first_frames: 172
    1.frame_load_cap: 1
- id: edit_frame1
  workflow: qwen_image_edit
  description: AI edit first frame
  depends_on:
  - extract_frame1
  requires_approval: true
  approval:
    timeout_hours: 24
    on_rejected: regenerate
    max_retries: 2
    timeout_action: auto_reject
  parameters:
    78.image: '{{ extract_frame1.output.image }}'
    111.prompt: Make the scene more vibrant and colorful with enhanced details
- id: edit_frame2
  workflow: qwen_image_edit
  description: AI edit second frame
  depends_on:
  - extract_frame2
  requires_approval: true
  approval:
    timeout_hours: 24
    on_rejected: regenerate
    max_retries: 2
    timeout_action: auto_reject
  parameters:
    78.image: '{{ extract_frame2.output.image }}'
    111.prompt: Make the person drink from a water bottle
- id: create_video
  workflow: firstEndTovideo
  description: Create video transitioning from first to last edited frame
  depends_on:
  - edit_frame1
  - edit_frame2
  requires_approval: true
  approval:
    timeout_hours: 24
    on_rejected: regenerate
    max_retries: 2
    timeout_action: auto_reject
  parameters:
    62.image: '{{ edit_frame1.output.image }}'
    68.image: '{{ edit_frame2.output.image }}'
    6.text: Smooth cinematic transition between vibrant colorful scenes
    67.width: 595
    67.height: 1025
    67.length: 81
    60.fps: 16
metadata:
  author: ComfyAutomate
  version: '1.0'
  tags:
  - video
  - image-edit
  - ai-enhancement
  - qwen
